<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

    <script src="script.js" defer></script>
    <title>Calculator</title>
</head>

<body>
    <div id="calculator">
        <div id="buttons">
            <div class="digit-row">
                <div id="display">
                    <p>0</p>
                </div>
            </div>
            <div class="digit-row">
                <div class="button clear" id="AC">AC</div>
                <div class="button backspace" id="backspace">Backspace</div>
            </div>
            <div class="digit-row">
                <div class="button number" id="7">7</div>
                <div class="button number" id="8">8</div>
                <div class="button number" id="9">9</div>
                <div class="button operator" id="/">%</div>
            </div>
            <div class="digit-row">
                <div class="button number" id="4">4</div>
                <div class="button number" id="5">5</div>
                <div class="button number" id="6">6</div>
                <div class="button operator" id="*">x</div>
            </div>
            <div class="digit-row">
                <div class="button number" id="1">1</div>
                <div class="button number" id="2">2</div>
                <div class="button number" id="3">3</div>
                <div class="button operator" id="-">-</div>
            </div>
            <div class="digit-row">
                <div class="button number" id="0">0</div>
                <div class="button decimal" id="decimal">.</div>
                <div class="button equals" id="=">=</div>
                <div class="button operator" id="+">+</div>
            </div>
        </div>

    </div>
    </div>
</body>

</html>
